name: Stage 4 foundational tests

on:
  push:
    branches:
      - stage4-repair
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage 4 unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit historical catalogue ingestion
        run: python scripts/audit_historical_catalog.py past_terms.json
